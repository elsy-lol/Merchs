<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админка{% endblock %} | MerchMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-panel: rgba(20, 20, 20, 0.7);
            --bg-elevated: rgba(35, 35, 35, 0.6);
            --text-main: #f5f5f5;
            --text-dim: #a0a0a0;
            --accent-glow: #ff006e;
            --accent-purple: #8338ec;
            --accent-success: #00ff88;
            --accent-warning: #ffbe0b;
            --accent-danger: #ff0044;
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius-xl: 16px;
            --radius-md: 10px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(255, 0, 110, 0.08) 0%, transparent 35%),
                radial-gradient(circle at 100% 100%, rgba(131, 56, 236, 0.08) 0%, transparent 35%);
        }
        
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .admin-sidebar {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 2.5rem 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        
        .admin-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .admin-logo span {
            background: linear-gradient(90deg, var(--accent-glow), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex-grow: 1;
        }
        
        .admin-nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.2rem;
            color: var(--text-dim);
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            border: 1px solid transparent;
        }
        
        .admin-nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transform: translateX(5px);
        }
        
        .admin-nav-link.active {
            background: linear-gradient(90deg, rgba(255, 0, 110, 0.2), rgba(131, 56, 236, 0.2));
            color: #fff;
            border-color: rgba(255, 0, 110, 0.3);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        /* Main Content */
        .admin-main {
            padding: 3rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3.5rem;
        }
        
        .admin-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }
        
        /* Premium Buttons */
        .btn {
            padding: 0.8rem 1.6rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-purple));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 110, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 0, 110, 0.5);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }
        
        .btn-danger {
            background: rgba(255, 0, 68, 0.15);
            color: var(--accent-danger);
            border: 1px solid rgba(255, 0, 68, 0.3);
        }
        
        .btn-danger:hover {
            background: var(--accent-danger);
            color: #fff;
        }
        
        /* Stats Cards - Glassmorphism */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3.5rem;
        }
        
        .stat-card {
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .stat-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        
        .stat-card-icon {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }
        
        .stat-card-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        
        .stat-card-label {
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        
        /* Premium Table */
        .admin-table {
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 1.4rem 1.8rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        
        th {
            background: rgba(255, 255, 255, 0.03);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: var(--text-dim);
        }
        
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
        }
        
        /* Badges */
        .badge {
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        
        .badge-success { background: rgba(0, 255, 136, 0.1); color: var(--accent-success); border: 1px solid rgba(0, 255, 136, 0.2); }
        .badge-warning { background: rgba(255, 190, 11, 0.1); color: var(--accent-warning); border: 1px solid rgba(255, 190, 11, 0.2); }
        .badge-danger { background: rgba(255, 0, 68, 0.1); color: var(--accent-danger); border: 1px solid rgba(255, 0, 68, 0.2); }
        .badge-info { background: rgba(0, 150, 255, 0.1); color: #0096ff; border: 1px solid rgba(0, 150, 255, 0.2); }
        
        /* Forms */
        .admin-form {
            background: var(--bg-panel);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 3rem;
        }
        
        .form-group { margin-bottom: 2rem; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-dim); margin-bottom: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            color: #fff;
            transition: all 0.3s ease;
        }
        
        .form-input:focus { outline: none; border-color: var(--accent-glow); box-shadow: 0 0 15px rgba(255, 0, 110, 0.2); }
        
        /* Messages */
        .messages { margin-bottom: 2rem; }
        .message { padding: 1.2rem 1.8rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-weight: 600; animation: slideIn 0.4s ease; }
        .message-success { background: rgba(0, 255, 136, 0.1); border: 1px solid var(--accent-success); color: var(--accent-success); }
        .message-error { background: rgba(255, 0, 68, 0.1); border: 1px solid var(--accent-danger); color: var(--accent-danger); }
        
        @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Animations */
        .animate-fade-in { animation: fadeIn 0.8s ease backwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 1024px) {
            .admin-layout { grid-template-columns: 1fr; }
            .admin-sidebar { position: fixed; bottom: 0; top: auto; height: 70px; width: 100%; flex-direction: row; padding: 0.5rem; justify-content: space-around; }
            .admin-logo, .admin-sidebar hr, .admin-nav span { display: none; }
            .admin-nav { flex-direction: row; width: 100%; justify-content: space-around; }
            .admin-main { padding: 1.5rem; padding-bottom: 100px; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo"><span>MERCH</span> ADMIN</div>
            <nav class="admin-nav">
                <a href="{% url 'custom-admin-dashboard' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'custom-admin-dashboard' %}active{% endif %}">
                    <span class="icon">📊</span>
                    <span>Дашборд</span>
                </a>
                <a href="{% url 'custom-admin-creators' %}" class="admin-nav-link {% if 'creator' in request.resolver_match.url_name %}active{% endif %}">
                    <span class="icon">🎤</span>
                    <span>Исполнители</span>
                </a>
                <a href="{% url 'custom-admin-categories' %}" class="admin-nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}">
                    <span class="icon">📁</span>
                    <span>Категории</span>
                </a>
                <a href="{% url 'custom-admin-products' %}" class="admin-nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}">
                    <span class="icon">👕</span>
                    <span>Товары</span>
                </a>
                <a href="{% url 'custom-admin-orders' %}" class="admin-nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}">
                    <span class="icon">📦</span>
                    <span>Заказы</span>
                </a>
                <a href="{% url 'custom-admin-payments' %}" class="admin-nav-link {% if 'payment' in request.resolver_match.url_name %}active{% endif %}">
                    <span class="icon">💳</span>
                    <span>Платежи</span>
                </a>
                <a href="{% url 'custom-admin-users' %}" class="admin-nav-link {% if 'user' in request.resolver_match.url_name %}active{% endif %}">
                    <span class="icon">👥</span>
                    <span>Пользователи</span>
                </a>
                <hr style="border-color: var(--glass-border); margin: 1rem 0;">
                <a href="/" class="admin-nav-link">
                    <span class="icon">🏠</span>
                    <span>На сайт</span>
                </a>
                <a href="{% url 'custom-admin-logout' %}" class="admin-nav-link" style="color: var(--accent-danger);">
                    <span class="icon">🚪</span>
                    <span>Выход</span>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="admin-main">
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message {% if message.tags == 'success' %}message-success{% else %}message-error{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
